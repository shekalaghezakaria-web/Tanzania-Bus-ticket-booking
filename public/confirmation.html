<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmation - SafariBus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo"><h2>🚌 SafariBus</h2></div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="routes.html" class="nav-link">Routes</a></li>
                <li class="nav-item"><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li class="nav-item"><a href="register.html" class="nav-link btn-register">Register</a></li>
            </ul>
        </div>
    </nav>

    <section class="confirmation-section">
        <div class="container">
            <div class="confirmation-card">
                <div class="success-icon">✅</div>
                <h1>Booking Confirmed!</h1>
                <p>Your ticket has been successfully booked</p>
                
                <div id="bookingDetails" class="booking-details">
                    <!-- Details will be loaded here -->
                </div>
                
                <div class="confirmation-actions">
                    <button id="printTicket" class="btn btn-secondary">🖨️ Print Ticket</button>
                    <a href="dashboard.html" class="btn btn-primary">View My Bookings</a>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 SafariBus. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
