<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safari Zangu - Redirect</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 2em;
        }
        .btn {
            background: #4caf50;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }
        .instructions {
            margin: 20px 0;
            font-size: 14px;
            line-height: 1.6;
        }
        .emoji {
            font-size: 3em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🚌</div>
        <h1>Safari Zangu</h1>
        <div class="instructions">
            <p><strong>SSL Error Fixed!</strong></p>
            <p>Use the HTTP link below to access the app:</p>
        </div>
        
        <a href="http://192.168.100.7:5000" class="btn">
            📱 Open SafariBus App
        </a>
        
        <div class="instructions">
            <p><strong>Alternative URLs:</strong></p>
            <p>📱 Mobile: http://192.168.100.7:5000</p>
            <p>💻 Local: http://localhost:5000</p>
        </div>
        
        <div class="instructions">
            <small>
                If you still see SSL errors, make sure to type <strong>http://</strong> 
                (not https://) in your browser
            </small>
        </div>
    </div>
    
    <script>
        // Auto-redirect after 3 seconds
        setTimeout(() => {
            window.location.href = 'http://192.168.100.7:5000';
        }, 3000);
        
        // Detect HTTPS and redirect to HTTP
        if (window.location.protocol === 'https:') {
            window.location.href = 'http://' + window.location.hostname + ':5000';
        }
    </script>
</body>
</html>
